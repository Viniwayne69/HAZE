<!--
Operação Dominação Global — Sistema pessoal de gestão de vendas.
Como abrir: clique duas vezes neste arquivo ou arraste-o para um navegador moderno (Chrome, Edge, Safari ou Firefox).
Login padrão: usuário "Vini" e senha "Pensediferente!".
Backup: após entrar, acesse Configurações > Backup e clique em "Exportar JSON" ou "Exportar XLSX".
Aviso de segurança: este login é apenas um cadeado client-side para uso pessoal; as credenciais ficam no código e não substituem autenticação real com backend.
-->
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#F5F5F7" />
  <title>Operação Dominação Global</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.3/Sortable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root{--bg:#F5F5F7;--surface:#FFFFFF;--surface2:#FBFBFD;--text:#1D1D1F;--muted:#86868B;--border:#D2D2D7;--blue:#0071E3;--green:#34C759;--orange:#FF9500;--red:#FF3B30;--purple:#AF52DE;--shadow:0 4px 24px rgba(0,0,0,.06);--glass:rgba(245,245,247,.72)}
    .dark{--bg:#000000;--surface:#1C1C1E;--surface2:#2C2C2E;--text:#F5F5F7;--muted:#98989D;--border:#38383A;--shadow:0 10px 30px rgba(0,0,0,.5);--glass:rgba(28,28,30,.76)}
    *{box-sizing:border-box} html{scroll-behavior:smooth} body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);transition:background .25s cubic-bezier(.4,0,.2,1),color .25s}
    .app-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow)} .inner-card{background:var(--surface2);border:1px solid var(--border);border-radius:12px}
    .glass{backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);background:var(--glass);border-color:var(--border)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:10px;padding:.65rem 1rem;font-weight:600;transition:transform .2s cubic-bezier(.4,0,.2,1),background .2s,opacity .2s;white-space:nowrap}.btn:active{transform:scale(.97)}.btn-primary{background:var(--blue);color:#fff}.btn-secondary{background:#E8E8ED;color:#1D1D1F}.dark .btn-secondary{background:#2C2C2E;color:#F5F5F7}.btn-danger{background:var(--red);color:#fff}.btn-ghost{background:transparent;color:var(--text)}
    input,select,textarea{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:.7rem .85rem;outline:0;transition:box-shadow .2s,border .2s} input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,113,227,.2)} textarea{min-height:112px}.label{font-size:.78rem;color:var(--muted);font-weight:700;margin-bottom:.35rem;display:block}.muted{color:var(--muted)}
    .nav-item{border-radius:12px;color:var(--muted);transition:background .2s,color .2s}.nav-item.active,.nav-item:hover{background:rgba(0,113,227,.12);color:var(--blue)}
    .status-pill{border-radius:999px;padding:.22rem .55rem;font-size:.72rem;font-weight:700}.kpi-number{font-size:clamp(2.3rem,5vw,3.5rem);font-weight:700;letter-spacing:-.05em}.page-title{font-size:clamp(2rem,5vw,2.6rem);font-weight:700;letter-spacing:-.04em}.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(14px);z-index:60;display:flex;align-items:center;justify-content:center;padding:1rem}.modal{max-height:90vh;overflow:auto;animation:pop .22s cubic-bezier(.4,0,.2,1)}@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
    .toast{background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:14px;padding:.85rem 1rem;min-width:280px;animation:slidein .22s ease}.toast.success{border-left:4px solid var(--green)}.toast.error{border-left:4px solid var(--red)}.toast.info{border-left:4px solid var(--blue)}@keyframes slidein{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
    .kanban-col{min-height:560px}.kanban-card{cursor:grab;border-left:4px solid var(--blue)}.sortable-ghost{opacity:.45}.table-wrap{overflow:auto;max-height:68vh}.sticky-th{position:sticky;top:0;background:var(--surface);z-index:1}.bottom-tab{color:var(--muted)}.bottom-tab.active{color:var(--blue)}
    .skeleton{background:linear-gradient(90deg,var(--surface2),rgba(134,134,139,.18),var(--surface2));background-size:200% 100%;animation:shimmer 1.2s infinite}@keyframes shimmer{to{background-position:-200% 0}}@media (max-width: 900px){.desktop-sidebar{display:none}.main-shell{padding-left:0!important}.mobile-bottom{display:flex!important}.kanban-board{grid-auto-columns:82vw}.hide-mobile{display:none!important}}
  </style>
</head>
<body>
  <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4 bg-[radial-gradient(circle_at_top_left,rgba(0,113,227,.22),transparent_35%),linear-gradient(145deg,#f5f5f7,#ffffff)] dark:bg-[radial-gradient(circle_at_top_left,rgba(0,113,227,.25),transparent_35%),linear-gradient(145deg,#000,#1c1c1e)]">
    <button id="themeLogin" class="btn btn-secondary fixed right-4 top-4" aria-label="Alternar tema">☾</button>
    <section class="app-card modal w-full max-w-md p-8 text-center">
      <div class="mx-auto mb-5 h-20 w-20 rounded-[24px] bg-[#0071E3] text-white grid place-items-center text-2xl font-bold shadow-lg">ODG</div>
      <h1 class="page-title mb-2">Operação Dominação Global</h1>
      <p class="muted mb-8">Entre para comandar seu funil de vendas no Google Maps.</p>
      <form id="loginForm" class="space-y-4 text-left">
        <div><label class="label" for="loginUser">Usuário</label><input id="loginUser" class="w-full" value="Vini" autocomplete="username" required /></div>
        <div><label class="label" for="loginPass">Senha</label><input id="loginPass" class="w-full" type="password" value="Pensediferente!" autocomplete="current-password" required /></div>
        <label class="flex items-center gap-2 text-sm muted"><input id="rememberMe" type="checkbox" class="w-4 h-4" /> Manter conectado</label>
        <button class="btn btn-primary w-full" type="submit">🔒 Entrar no sistema</button>
        <p class="text-xs muted text-center">Login client-side para uso pessoal. Não é segurança real.</p>
      </form>
    </section>
  </div>

  <div id="app" class="hidden min-h-screen">
    <aside class="desktop-sidebar glass fixed left-0 top-0 z-40 h-screen w-72 border-r p-5">
      <div class="flex items-center gap-3 mb-8"><div class="h-11 w-11 rounded-2xl bg-[#0071E3] text-white grid place-items-center font-bold">ODG</div><div><strong>Dominação Global</strong><p class="text-xs muted">Vendas Google Maps</p></div></div>
      <nav id="sidebarNav" class="space-y-1"></nav>
      <button id="logoutBtn" class="btn btn-secondary w-full mt-8">Sair</button>
    </aside>
    <main class="main-shell pl-72 pb-20">
      <header class="glass sticky top-0 z-30 border-b px-4 sm:px-8 py-4 flex items-center justify-between">
        <div><h1 id="viewTitle" class="text-2xl sm:text-3xl font-bold tracking-[-.04em]">Dashboard</h1><p id="viewSub" class="muted text-sm">Visão geral da operação.</p></div>
        <div class="flex gap-2"><button id="globalSearchBtn" class="btn btn-secondary hide-mobile">⌘K Buscar</button><button id="newProspectTop" class="btn btn-primary">+ Novo</button><button id="themeToggle" class="btn btn-secondary" aria-label="Alternar tema">☾</button></div>
      </header>
      <section id="content" class="p-4 sm:p-8"></section>
    </main>
    <nav id="bottomNav" class="mobile-bottom hidden fixed bottom-0 left-0 right-0 z-50 glass border-t justify-around py-2"></nav>
  </div>

  <div id="modalRoot"></div><div id="toastRoot" class="fixed bottom-4 right-4 z-[80] space-y-3"></div>

<script>
/* ========================= CONFIGURAÇÃO E ESTADO ========================= */
const AUTH_USER='Vini', AUTH_PASS='Pensediferente!', STORAGE_KEY='odg_data';
const STATUS=['Não contatado','Contatado','Negociando','Fechado','Recusou'];
const FIELDS=[['nomeEmpresa','Nome da Empresa'],['nomeResponsavel','Nome do Responsável'],['whatsappResponsavel','WhatsApp do Responsável'],['contatoEmpresa','Contato Empresa'],['nomeProprietario','Nome Proprietário'],['whatsappProprietario','WhatsApp Proprietário'],['razaoSocial','Razão Social'],['cnpj','CNPJ'],['endereco','Endereço'],['bairro','Bairro'],['cidade','Cidade'],['linkMaps','Link (Google Maps)'],['observacao','Observação'],['servicosOferecer','Serviços a Oferecer'],['status','Status'],['origem','Origem']];
const DEFAULT_TEMPLATES={primeira:'Olá! Tudo bem? Sou {userName}, especialista em otimização do Google Meu Negócio. Vi o perfil da {nomeLoja} aqui no Maps e identifiquei alguns pontos que podem estar fazendo vocês perderem clientes (foto da fachada desatualizada, informações incompletas). Posso te explicar em 2 minutos?',follow:'Oi! Aqui é {userName}. Passando aqui pra retomar nossa conversa sobre o Google Maps da {nomeLoja}. Conseguiu pensar na proposta?',fechamento:'Show! Pra fechar, o pacote anual fica R$ 370 (à vista/Pix) ou 10x de R$ 41,11. Inclui: atualização completa do cadastro, até 10 fotos profissionais (fachada + internas) e suporte por 1 ano. Posso enviar o Pix?'};
let state={settings:{darkMode:false,monthlyGoal:20,annualGoal:240,priceCharged:370,commission:40,userName:'Vini',templates:DEFAULT_TEMPLATES},users:[{name:'Vini'}],prospects:[],actions:[],transactions:[]};
let currentView='dashboard', charts={}, sortState={key:'createdAt',dir:'desc'}, selectedRows=new Set(), importRows=[], importMap=[];
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const uid=()=>crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(16).slice(2);
const money=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmt=d=>d?new Date(d).toLocaleDateString('pt-BR'):'';
const todayISO=()=>new Date().toISOString().slice(0,10);
const statusColor=s=>({'Não contatado':'#86868B','Contatado':'#0071E3','Negociando':'#FF9500','Fechado':'#34C759','Recusou':'#FF3B30'}[s]||'#0071E3');
const normalizePhone=p=>(p||'').replace(/\D/g,'').replace(/^55/,'');
function defaultData(){return {settings:{darkMode:matchMedia('(prefers-color-scheme: dark)').matches,monthlyGoal:20,annualGoal:240,priceCharged:370,commission:40,userName:'Vini',templates:{...DEFAULT_TEMPLATES}},users:[{name:'Vini'}],prospects:[],actions:[],transactions:[]};}
function load(){try{state={...defaultData(),...(JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}'))};state.settings={...defaultData().settings,...(state.settings||{}),templates:{...DEFAULT_TEMPLATES,...(state.settings?.templates||{})}};state.users=state.users||[];state.prospects=state.prospects||[];state.actions=state.actions||[];state.transactions=state.transactions||[]}catch(e){state=defaultData()}applyTheme()}
let saveTimer;function save(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>localStorage.setItem(STORAGE_KEY,JSON.stringify(state)),300)}
function applyTheme(){document.documentElement.classList.toggle('dark',!!state.settings.darkMode);$('#themeToggle')&&($('#themeToggle').textContent=state.settings.darkMode?'☀︎':'☾');$('#themeLogin')&&($('#themeLogin').textContent=state.settings.darkMode?'☀︎':'☾')}
function toast(msg,type='success',action){const el=document.createElement('div');el.className=`toast ${type}`;el.innerHTML=`<div class="flex items-center justify-between gap-4"><span>${msg}</span>${action?`<button class="text-[#0071E3] font-bold">${action.label}</button>`:''}</div>`;$('#toastRoot').appendChild(el);if(action)el.querySelector('button').onclick=()=>{action.fn();el.remove()};setTimeout(()=>el.remove(),action?5000:3000)}
function record(type,prospectId,note='',from='',to=''){state.actions.unshift({id:uid(),prospectId,type,from,to,note,createdAt:new Date().toISOString()});save()}

/* ========================= LOGIN E NAVEGAÇÃO ========================= */
const NAV=[['dashboard','Dashboard','◼︎','Visão geral da operação.'],['pipeline','Pipeline','▥','Kanban arrastável de prospects.'],['lista','Lista','☷','Tabela completa e edição rápida.'],['importar','Importar','⇩','Cole do Excel ou cadastre manualmente.'],['tarefas','Follow-up','◷','Ações e retornos agendados.'],['financeiro','Financeiro','R$','Comissões, vendas e metas.'],['settings','Configurações','⚙','Preferências e backup.']];
function initAuth(){load();const ok=sessionStorage.getItem('odg_session')||localStorage.getItem('odg_session');if(ok)showApp();else showLogin();$('#loginForm').onsubmit=e=>{e.preventDefault();if($('#loginUser').value===AUTH_USER&&$('#loginPass').value===AUTH_PASS){($('#rememberMe').checked?localStorage:sessionStorage).setItem('odg_session','1');showApp()}else toast('Credenciais inválidas.','error')};$('#themeLogin').onclick=toggleTheme}
function showLogin(){$('#loginScreen').classList.remove('hidden');$('#app').classList.add('hidden');applyTheme()}
function showApp(){$('#loginScreen').classList.add('hidden');$('#app').classList.remove('hidden');renderNav();render();setTimeout(()=>toast(`Bem-vindo, ${state.settings.userName}!`,'info'),250)}
function renderNav(){const html=NAV.map(n=>`<button class="nav-item ${currentView===n[0]?'active':''} w-full flex items-center gap-3 px-3 py-3 text-left" data-view="${n[0]}"><span class="w-6 text-center">${n[2]}</span><span>${n[1]}</span></button>`).join('');$('#sidebarNav').innerHTML=html;$('#bottomNav').innerHTML=NAV.slice(0,5).map(n=>`<button class="bottom-tab ${currentView===n[0]?'active':''} flex flex-col items-center text-xs" data-view="${n[0]}"><span>${n[2]}</span><span>${n[1].split(' ')[0]}</span></button>`).join('');$$('[data-view]').forEach(b=>b.onclick=()=>{currentView=b.dataset.view;renderNav();render()});}
function render(){const nav=NAV.find(n=>n[0]===currentView);$('#viewTitle').textContent=nav[1];$('#viewSub').textContent=nav[3];Object.values(charts).forEach(c=>c?.destroy?.());charts={};({dashboard:renderDashboard,pipeline:renderPipeline,lista:renderLista,importar:renderImportar,tarefas:renderTarefas,financeiro:renderFinanceiro,settings:renderSettings}[currentView])();}
function toggleTheme(){state.settings.darkMode=!state.settings.darkMode;applyTheme();save()}

/* ========================= CÁLCULOS E COMPONENTES ========================= */
function monthKey(d=new Date()){return new Date(d).toISOString().slice(0,7)}
function metrics(){const p=state.prospects,t=state.transactions,nowM=monthKey();const monthTx=t.filter(x=>monthKey(x.closedAt)===nowM);const contacted=p.filter(x=>x.status!=='Não contatado').length;return{total:p.length,active:p.filter(x=>['Contatado','Negociando'].includes(x.status)).length,closedMonth:monthTx.length,commissionMonth:monthTx.reduce((a,x)=>a+x.commission,0),revenue:t.reduce((a,x)=>a+x.amount,0),commissionTotal:t.reduce((a,x)=>a+x.commission,0),conversion:contacted?Math.round(p.filter(x=>x.status==='Fechado').length/contacted*100):0,pending:t.filter(x=>!x.paid).reduce((a,x)=>a+x.commission,0)}}
function emptyState(title,msg,cta){return `<div class="app-card p-10 text-center"><div class="text-6xl mb-4">◎</div><h3 class="text-xl font-bold mb-2">${title}</h3><p class="muted mb-5">${msg}</p>${cta||''}</div>`}
function kpi(label,value,sub,color='var(--text)'){return `<div class="app-card p-5"><p class="muted text-sm font-semibold">${label}</p><div class="kpi-number" style="color:${color}">${value}</div><p class="text-sm muted">${sub||'&nbsp;'}</p></div>`}
function progress(v,max){const pct=Math.min(100,Math.round((v/(max||1))*100));return `<div class="h-2 rounded-full bg-gray-200 dark:bg-[#38383A] overflow-hidden"><div class="h-full bg-[#0071E3] rounded-full" style="width:${pct}%"></div></div><p class="text-xs muted mt-1">${pct}% da meta</p>`}
function unique(key){return [...new Set(state.prospects.map(p=>p[key]).filter(Boolean))].sort()}

/* ========================= DASHBOARD ========================= */
function renderDashboard(){const m=metrics();const week=state.prospects.filter(p=>Date.now()-new Date(p.createdAt).getTime()<7*864e5).length;const next=state.prospects.filter(p=>p.nextFollowUp).sort((a,b)=>new Date(a.nextFollowUp)-new Date(b.nextFollowUp))[0];const due=state.prospects.filter(p=>p.nextFollowUp&&p.nextFollowUp.slice(0,10)<=todayISO());$('#content').innerHTML=`<div class="space-y-6"><div class="grid grid-cols-2 xl:grid-cols-4 gap-4">${kpi('Total de prospects',m.total,`+${week} nos últimos 7 dias`)}${kpi('No funil ativo',m.active,'Contatado + Negociando')}${kpi('Fechados no mês',m.closedMonth,progress(m.closedMonth,state.settings.monthlyGoal))}${kpi('Comissão do mês',money(m.commissionMonth),'Acumulada no mês','var(--green)')}</div><div class="grid grid-cols-2 xl:grid-cols-4 gap-4">${kpi('Receita bruta gerada',money(m.revenue),'Total vendido')}${kpi('Sua comissão total',money(m.commissionTotal),'Todos os tempos','var(--green)')}${kpi('Taxa de conversão',m.conversion+'%','Fechados / contatados')}${kpi('Próximo follow-up',next?fmt(next.nextFollowUp):'—',next?next.nomeEmpresa:'Nada agendado','var(--orange)')}</div><div class="grid xl:grid-cols-3 gap-4"><div class="app-card p-5 xl:col-span-2"><h3 class="font-bold mb-4">Fechamentos por mês</h3><canvas id="lineChart"></canvas></div><div class="app-card p-5"><h3 class="font-bold mb-4">Distribuição do funil</h3><canvas id="donutChart"></canvas></div><div class="app-card p-5 xl:col-span-3"><h3 class="font-bold mb-4">Top 5 bairros</h3><canvas id="barChart"></canvas></div></div><div class="app-card p-5"><h3 class="font-bold mb-4">Ações de hoje</h3>${due.length?due.map(p=>taskRow(p)).join(''):emptyState('Tudo em dia','Nenhum follow-up vencido ou marcado para hoje.','')}</div></div>`;drawDashboardCharts()}
function drawDashboardCharts(){const labels=[...Array(6)].map((_,i)=>{const d=new Date();d.setMonth(d.getMonth()-5+i);return d.toISOString().slice(0,7)});charts.line=new Chart($('#lineChart'),{type:'line',data:{labels,datasets:[{label:'Vendas',data:labels.map(l=>state.transactions.filter(t=>monthKey(t.closedAt)===l).length),borderColor:'#0071E3',backgroundColor:'rgba(0,113,227,.12)',tension:.35,fill:true}]},options:{responsive:true}});charts.donut=new Chart($('#donutChart'),{type:'doughnut',data:{labels:STATUS,datasets:[{data:STATUS.map(s=>state.prospects.filter(p=>p.status===s).length),backgroundColor:STATUS.map(statusColor)}]},options:{plugins:{legend:{position:'bottom'}}}});const bairros=Object.entries(state.prospects.reduce((a,p)=>(p.bairro&&(a[p.bairro]=(a[p.bairro]||0)+1),a),{})).sort((a,b)=>b[1]-a[1]).slice(0,5);charts.bar=new Chart($('#barChart'),{type:'bar',data:{labels:bairros.map(x=>x[0]),datasets:[{label:'Prospects',data:bairros.map(x=>x[1]),backgroundColor:'#AF52DE'}]},options:{indexAxis:'y',plugins:{legend:{display:false}}}})}

/* ========================= PROSPECTS, STATUS E WHATSAPP ========================= */
function makeProspect(obj={}){const now=new Date().toISOString();return {id:uid(),nomeEmpresa:'',nomeResponsavel:'',whatsappResponsavel:'',contatoEmpresa:'',nomeProprietario:'',whatsappProprietario:'',razaoSocial:'',cnpj:'',endereco:'',bairro:'',cidade:'',linkMaps:'',observacao:'',servicosOferecer:'',status:'Não contatado',origem:'',createdAt:now,updatedAt:now,closedAt:null,nextFollowUp:null,tags:[],...obj}}
function setStatus(p,newStatus,opts={}){const old=p.status;if(old===newStatus)return;p.status=newStatus;p.updatedAt=new Date().toISOString();if(newStatus==='Fechado'){p.closedAt=p.closedAt||new Date().toISOString();if(opts.transaction!==false&&!state.transactions.some(t=>t.prospectId===p.id)){state.transactions.push({id:uid(),prospectId:p.id,prospectName:p.nomeEmpresa,amount:+state.settings.priceCharged,commission:+state.settings.commission,closedAt:p.closedAt,paid:false})}}record('status_change',p.id,'',old,newStatus);save();}
function openWhatsApp(p,type='primeira'){const tel=normalizePhone(p.whatsappResponsavel||p.whatsappProprietario||p.contatoEmpresa);if(!tel)return toast('Nenhum telefone encontrado.','error');const tpl=state.settings.templates[type]||DEFAULT_TEMPLATES[type]||'';const msg=tpl.replaceAll('{userName}',state.settings.userName).replaceAll('{nomeLoja}',p.nomeEmpresa).replaceAll('{nome}',p.nomeResponsavel||p.nomeProprietario||'').replaceAll('{bairro}',p.bairro||'');window.open(`https://wa.me/55${tel}?text=${encodeURIComponent(msg)}`,'_blank');record('whatsapp_sent',p.id,`Template: ${type}`);toast('WhatsApp aberto.','success')}
function deleteProspect(id){const idx=state.prospects.findIndex(p=>p.id===id);if(idx<0)return;const removed=state.prospects.splice(idx,1)[0];state.transactions=state.transactions.filter(t=>t.prospectId!==id);save();render();toast('Prospect excluído.','error',{label:'Desfazer',fn:()=>{state.prospects.splice(idx,0,removed);save();render();toast('Exclusão desfeita.')}})}
function taskRow(p){return `<div class="inner-card p-4 mb-3 flex flex-col md:flex-row md:items-center justify-between gap-3"><div><strong>${p.nomeEmpresa||'Sem nome'}</strong><p class="muted text-sm">${p.status} • ${fmt(p.nextFollowUp)} • ${p.observacao||'Sem nota'}</p></div><div class="flex flex-wrap gap-2"><button class="btn btn-primary" onclick="openWhatsApp(findP('${p.id}'),'follow')">WhatsApp</button><button class="btn btn-secondary" onclick="postpone('${p.id}',3)">Adiar 3 dias</button><button class="btn btn-secondary" onclick="completeFollow('${p.id}')">Concluir</button></div></div>`}
function findP(id){return state.prospects.find(p=>p.id===id)}

/* ========================= PIPELINE ========================= */
function renderPipeline(){const options=(key)=>`<option value="">${key}</option>`+unique(key).map(x=>`<option>${x}</option>`).join('');$('#content').innerHTML=`<div class="space-y-4"><div class="app-card p-4 grid md:grid-cols-4 gap-3"><input id="pipeSearch" placeholder="Buscar no pipeline..."/><select id="pipeBairro">${options('bairro')}</select><select id="pipeOrigem">${options('origem')}</select><input id="pipeTag" placeholder="Filtrar por tag"/></div><div id="kanban" class="kanban-board grid grid-flow-col auto-cols-[360px] gap-4 overflow-x-auto pb-3"></div></div>`;['pipeSearch','pipeBairro','pipeOrigem','pipeTag'].forEach(id=>$('#'+id).oninput=drawKanban);drawKanban()}
function pipeFiltered(){const q=($('#pipeSearch')?.value||'').toLowerCase(),b=$('#pipeBairro')?.value,o=$('#pipeOrigem')?.value,t=($('#pipeTag')?.value||'').toLowerCase();return state.prospects.filter(p=>(!q||JSON.stringify(p).toLowerCase().includes(q))&&(!b||p.bairro===b)&&(!o||p.origem===o)&&(!t||(p.tags||[]).join(' ').toLowerCase().includes(t)))}
function drawKanban(){const list=pipeFiltered();$('#kanban').innerHTML=STATUS.map(s=>`<section class="app-card p-3 kanban-col"><div class="flex justify-between items-center mb-3"><h3 class="font-bold">${s}</h3><span class="status-pill" style="background:${statusColor(s)}22;color:${statusColor(s)}">${list.filter(p=>p.status===s).length}</span></div><div class="space-y-3 min-h-[480px]" data-status="${s}">${list.filter(p=>p.status===s).map(kanbanCard).join('')}</div></section>`).join('');$$('[data-status]').forEach(col=>new Sortable(col,{group:'pipeline',animation:180,onAdd:e=>{const p=findP(e.item.dataset.id),to=e.to.dataset.status,from=p.status;if(to==='Fechado'&&!confirm('Registrar venda e gerar comissão automaticamente?'))setStatus(p,to,{transaction:false});else setStatus(p,to);if(from==='Não contatado'&&to!=='Não contatado'&&confirm('Deseja agendar follow-up para daqui 2 dias?')){const d=new Date();d.setDate(d.getDate()+2);p.nextFollowUp=d.toISOString();record('follow_up_set',p.id,'Follow-up automático em 2 dias')}save();renderPipeline();toast('Status atualizado.')}}));}
function kanbanCard(p){return `<article class="kanban-card inner-card p-4" data-id="${p.id}" style="border-left-color:${statusColor(p.status)}" tabindex="0" onclick="openProspectDrawer('${p.id}')"><strong>${p.nomeEmpresa||'Sem nome'}</strong><p class="muted text-sm">${p.bairro||'Sem bairro'} • ${p.cidade||''}</p><div class="flex items-center justify-between mt-3"><button class="text-[#0071E3] text-sm" onclick="event.stopPropagation();openWhatsApp(findP('${p.id}'))">WhatsApp</button><span class="text-xs muted">${p.nextFollowUp?'◷ '+fmt(p.nextFollowUp):''}</span></div></article>`}

/* ========================= LISTA ========================= */
function renderLista(){selectedRows.clear();const filters=`<div class="app-card p-4 grid md:grid-cols-6 gap-3"><input id="listSearch" class="md:col-span-2" placeholder="Busca global..."/><select id="filterStatus"><option value="">Status</option>${STATUS.map(s=>`<option>${s}</option>`).join('')}</select><select id="filterBairro"><option value="">Bairro</option>${unique('bairro').map(x=>`<option>${x}</option>`).join('')}</select><select id="filterCidade"><option value="">Cidade</option>${unique('cidade').map(x=>`<option>${x}</option>`).join('')}</select><select id="filterFollow"><option value="">Follow-up?</option><option value="sim">Sim</option><option value="nao">Não</option></select></div>`;$('#content').innerHTML=`<div class="space-y-4">${filters}<div class="flex flex-wrap gap-2"><button class="btn btn-primary" onclick="openProspectModal()">+ Novo prospect</button><button class="btn btn-secondary" onclick="bulkStatus()">Mudar status em lote</button><button class="btn btn-secondary" onclick="exportSelected()">Exportar selecionados</button><button class="btn btn-danger" onclick="bulkDelete()">Deletar selecionados</button></div><div class="app-card table-wrap"><table class="w-full text-sm"><thead><tr class="border-b border-[var(--border)]"><th class="sticky-th p-3"><input id="selectAll" type="checkbox"></th>${['nomeEmpresa','status','bairro','cidade','whatsappResponsavel','origem','nextFollowUp'].map(k=>`<th class="sticky-th p-3 text-left cursor-pointer" onclick="sortBy('${k}')">${fieldLabel(k)}</th>`).join('')}<th class="sticky-th p-3">Ações</th></tr></thead><tbody id="listBody"></tbody></table></div></div>`;['listSearch','filterStatus','filterBairro','filterCidade','filterFollow'].forEach(id=>$('#'+id).oninput=drawList);$('#selectAll').onchange=e=>{$$('#listBody input[type=checkbox]').forEach(c=>{c.checked=e.target.checked;c.onchange()})};drawList()}
function fieldLabel(k){return Object.fromEntries(FIELDS)[k]||({nextFollowUp:'Follow-up',status:'Status'}[k]||k)}
function listFiltered(){const q=($('#listSearch')?.value||'').toLowerCase(),s=$('#filterStatus')?.value,b=$('#filterBairro')?.value,c=$('#filterCidade')?.value,f=$('#filterFollow')?.value;return state.prospects.filter(p=>(!q||JSON.stringify(p).toLowerCase().includes(q))&&(!s||p.status===s)&&(!b||p.bairro===b)&&(!c||p.cidade===c)&&(!f||(f==='sim'?p.nextFollowUp:!p.nextFollowUp))).sort((a,b)=>{let av=a[sortState.key]||'',bv=b[sortState.key]||'';return sortState.dir==='asc'?String(av).localeCompare(String(bv)):String(bv).localeCompare(String(av))})}
function drawList(){const rows=listFiltered();$('#listBody').innerHTML=rows.length?rows.map(p=>`<tr class="border-b border-[var(--border)] hover:bg-black/5 dark:hover:bg-white/5"><td class="p-3"><input type="checkbox" onchange="this.checked?selectedRows.add('${p.id}'):selectedRows.delete('${p.id}')"></td>${['nomeEmpresa','status','bairro','cidade','whatsappResponsavel','origem','nextFollowUp'].map(k=>`<td class="p-3" contenteditable="${k!=='status'}" onblur="inlineEdit('${p.id}','${k}',this.textContent)">${k==='status'?`<select onchange="inlineEdit('${p.id}','status',this.value)">${STATUS.map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('')}</select>`:(k==='nextFollowUp'?fmt(p[k]):(p[k]||''))}</td>`).join('')}<td class="p-3"><div class="flex gap-1"><button class="btn btn-secondary !p-2" onclick="openWhatsApp(findP('${p.id}'))">WA</button><button class="btn btn-secondary !p-2" onclick="window.open('${p.linkMaps||'#'}','_blank')">Maps</button><button class="btn btn-secondary !p-2" onclick="openProspectModal('${p.id}')">Editar</button><button class="btn btn-danger !p-2" onclick="confirm('Excluir prospect?')&&deleteProspect('${p.id}')">Excluir</button></div></td></tr>`).join(''):`<tr><td colspan="9" class="p-6">${emptyState('Lista vazia','Importe ou cadastre seu primeiro prospect.',`<button class="btn btn-primary" onclick="currentView='importar';renderNav();render()">Ir para importação</button>`)}</td></tr>`}
function sortBy(k){sortState.dir=sortState.key===k&&sortState.dir==='asc'?'desc':'asc';sortState.key=k;drawList()}
function inlineEdit(id,k,v){const p=findP(id);if(!p)return;if(k==='status'){setStatus(p,v);render()}else{p[k]=k==='nextFollowUp'?v:p[k]=v.trim();p.updatedAt=new Date().toISOString();save();toast('Campo salvo.')}}

/* ========================= IMPORTAÇÃO ========================= */
function renderImportar(){importRows=[];importMap=[];$('#content').innerHTML=`<div class="app-card p-5"><div class="flex gap-2 mb-5"><button class="btn btn-primary" id="tabPaste">Colar do Excel</button><button class="btn btn-secondary" id="tabManual">Cadastro Manual</button></div><div id="importPane"></div></div>`;$('#tabPaste').onclick=drawPaste;$('#tabManual').onclick=()=>drawManual();drawPaste()}
function drawPaste(){$('#importPane').innerHTML=`<div class="space-y-4"><p class="muted">Selecione a tabela no Excel/Sheets, copie (Ctrl+C) e cole aqui. Depois mapeie cada coluna.</p><textarea id="pasteArea" class="w-full" rows="8" placeholder="Cole aqui os dados tabulados..."></textarea><div id="mapPreview"></div><button class="btn btn-primary" onclick="importProspects()">Importar prospects</button></div>`;$('#pasteArea').oninput=parsePaste}
function parsePaste(){const txt=$('#pasteArea').value.trim();if(!txt){$('#mapPreview').innerHTML='';return}importRows=txt.split(/\r?\n/).filter(Boolean).map(r=>r.split('\t'));const max=Math.max(...importRows.map(r=>r.length));importMap=Array.from({length:max},(_,i)=>FIELDS[i]?.[0]||'');$('#mapPreview').innerHTML=`<div class="overflow-auto"><table class="w-full text-sm"><thead><tr>${Array.from({length:max},(_,i)=>`<th class="p-2"><select onchange="importMap[${i}]=this.value"><option value="">Ignorar</option>${FIELDS.map(f=>`<option value="${f[0]}" ${importMap[i]===f[0]?'selected':''}>${f[1]}</option>`).join('')}</select></th>`).join('')}</tr></thead><tbody><tr>${Array.from({length:max},(_,i)=>`<td class="p-2 muted">${importRows[0]?.[i]||''}</td>`).join('')}</tr></tbody></table></div><p class="muted text-sm mt-2">${importRows.length} linhas detectadas.</p>`}
function importProspects(){if(!importRows.length)return toast('Cole os dados antes de importar.','error');let created=0,updated=0,ignored=0;const dupMode=prompt('Duplicatas encontradas por CNPJ ou nome+endereço. Digite: ignorar, atualizar ou criar','ignorar')||'ignorar';for(const row of importRows){let obj={};importMap.forEach((k,i)=>{if(k)obj[k]=(row[i]||'').trim()});if(!obj.nomeEmpresa){ignored++;continue}obj.status=STATUS.includes(obj.status)?obj.status:'Não contatado';const dup=state.prospects.find(p=>(obj.cnpj&&p.cnpj===obj.cnpj)||(p.nomeEmpresa?.toLowerCase()===obj.nomeEmpresa.toLowerCase()&&p.endereco?.toLowerCase()===(obj.endereco||'').toLowerCase()));if(dup&&dupMode==='ignorar'){ignored++;continue}if(dup&&dupMode==='atualizar'){Object.assign(dup,obj,{updatedAt:new Date().toISOString()});updated++;continue}state.prospects.push(makeProspect(obj));created++}save();toast(`${created} criados, ${updated} atualizados, ${ignored} ignorados.`);renderImportar()}
function drawManual(id=null){$('#importPane').innerHTML=prospectForm(id,false)}

/* ========================= TAREFAS E FINANCEIRO ========================= */
function renderTarefas(){const items=state.prospects.filter(p=>p.nextFollowUp).sort((a,b)=>new Date(a.nextFollowUp)-new Date(b.nextFollowUp));const groups=[['Vencidos',p=>p.nextFollowUp.slice(0,10)<todayISO(),'var(--red)'],['Hoje',p=>p.nextFollowUp.slice(0,10)===todayISO(),'var(--orange)'],['Esta semana',p=>{const d=new Date(p.nextFollowUp),n=new Date(),w=new Date();w.setDate(n.getDate()+7);return d>n&&d<=w},'var(--blue)'],['Próximos',p=>{const d=new Date(p.nextFollowUp),w=new Date();w.setDate(w.getDate()+7);return d>w},'var(--muted)']];$('#content').innerHTML=`<div class="space-y-4">${items.length?groups.map(g=>`<section class="app-card p-5"><h3 class="font-bold mb-4" style="color:${g[2]}">${g[0]}</h3>${items.filter(g[1]).map(taskRow).join('')||'<p class="muted">Nenhum item.</p>'}</section>`).join(''):emptyState('Sem follow-ups','Agende retornos no pipeline ou no cadastro do prospect.','')}</div>`}
function postpone(id,days){const p=findP(id),d=new Date();d.setDate(d.getDate()+days);p.nextFollowUp=d.toISOString();record('follow_up_set',id,`Adiado ${days} dias`);save();render();toast('Follow-up adiado.')}
function completeFollow(id){const p=findP(id);p.nextFollowUp=null;record('note',id,'Follow-up concluído');save();render();toast('Follow-up concluído.')}
function renderFinanceiro(){const m=metrics();const month=state.transactions.filter(t=>monthKey(t.closedAt)===monthKey()).length;const missing=Math.max(0,state.settings.monthlyGoal-month);$('#content').innerHTML=`<div class="space-y-6"><div class="grid grid-cols-2 xl:grid-cols-4 gap-4">${kpi('Comissão total',money(m.commissionTotal),'Todos os tempos','var(--green)')}${kpi('Comissão este mês',money(m.commissionMonth),'Mês atual','var(--green)')}${kpi('Receita bruta',money(m.revenue),'Total gerado')}${kpi('Vendas a pagar',money(m.pending),'Comissão pendente','var(--orange)')}</div><div class="grid xl:grid-cols-3 gap-4"><div class="app-card p-5 xl:col-span-2"><h3 class="font-bold mb-4">Evolução mensal da comissão</h3><canvas id="financeChart"></canvas></div><div class="app-card p-5"><h3 class="font-bold mb-3">Meta mensal</h3>${progress(month,state.settings.monthlyGoal)}<p class="mt-4">Faltam <strong>${missing}</strong> vendas para bater a meta.</p><p class="muted text-sm">Projeção no ritmo atual: ${Math.round(month/(new Date().getDate())*new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate())} vendas.</p><button class="btn btn-primary mt-4" onclick="exportTransactions()">Exportar relatório</button></div></div><div class="app-card table-wrap"><table class="w-full text-sm"><thead><tr><th class="sticky-th p-3 text-left">Data</th><th class="sticky-th p-3 text-left">Loja</th><th class="sticky-th p-3">Valor</th><th class="sticky-th p-3">Comissão</th><th class="sticky-th p-3">Status</th><th class="sticky-th p-3">Ação</th></tr></thead><tbody>${state.transactions.map(t=>`<tr class="border-b border-[var(--border)]"><td class="p-3">${fmt(t.closedAt)}</td><td class="p-3">${t.prospectName}</td><td class="p-3">${money(t.amount)}</td><td class="p-3">${money(t.commission)}</td><td class="p-3">${t.paid?'Pago':'Pendente'}</td><td class="p-3"><button class="btn btn-secondary !p-2" onclick="togglePaid('${t.id}')">${t.paid?'Marcar pendente':'Marcar pago'}</button></td></tr>`).join('')||`<tr><td colspan="6" class="p-5">Nenhuma transação ainda.</td></tr>`}</tbody></table></div></div>`;const labels=[...Array(6)].map((_,i)=>{const d=new Date();d.setMonth(d.getMonth()-5+i);return d.toISOString().slice(0,7)});charts.fin=new Chart($('#financeChart'),{type:'line',data:{labels,datasets:[{label:'Comissão',data:labels.map(l=>state.transactions.filter(t=>monthKey(t.closedAt)===l).reduce((a,t)=>a+t.commission,0)),borderColor:'#34C759',backgroundColor:'rgba(52,199,89,.14)',fill:true,tension:.35}]}})}
function togglePaid(id){const t=state.transactions.find(x=>x.id===id);t.paid=!t.paid;save();render();toast('Transação atualizada.')}

/* ========================= CONFIGURAÇÕES, MODAIS E EXPORTAÇÃO ========================= */
function renderSettings(){const s=state.settings;$('#content').innerHTML=`<div class="grid xl:grid-cols-2 gap-5"><section class="app-card p-5"><h3 class="font-bold mb-4">Preferências</h3><div class="grid md:grid-cols-2 gap-4">${settingInput('userName','Nome do usuário',s.userName)}${settingInput('monthlyGoal','Meta mensal',s.monthlyGoal,'number')}${settingInput('annualGoal','Meta anual',s.annualGoal,'number')}${settingInput('priceCharged','Preço cobrado',s.priceCharged,'number')}${settingInput('commission','Comissão por venda',s.commission,'number')}</div><button class="btn btn-primary mt-4" onclick="saveSettings()">Salvar configurações</button></section><section class="app-card p-5"><h3 class="font-bold mb-4">Templates de WhatsApp</h3><label class="label">Primeira abordagem</label><textarea id="tpl_primeira" class="w-full mb-3">${s.templates.primeira}</textarea><label class="label">Follow-up</label><textarea id="tpl_follow" class="w-full mb-3">${s.templates.follow}</textarea><label class="label">Fechamento</label><textarea id="tpl_fechamento" class="w-full mb-3">${s.templates.fechamento}</textarea><p class="muted text-sm">Variáveis: {userName}, {nome}, {bairro}, {nomeLoja}</p></section><section class="app-card p-5"><h3 class="font-bold mb-4">Backup</h3><div class="flex flex-wrap gap-2"><button class="btn btn-primary" onclick="exportJSON()">Exportar JSON</button><button class="btn btn-secondary" onclick="exportAllXLSX()">Exportar XLSX</button><label class="btn btn-secondary cursor-pointer">Importar JSON<input type="file" accept="application/json" class="hidden" onchange="importJSON(this.files[0])"></label></div></section><section class="app-card p-5"><h3 class="font-bold text-red-500 mb-4">Zona perigosa</h3><button class="btn btn-danger" onclick="resetAll()">Resetar tudo</button></section></div>`}
function settingInput(id,label,val,type='text'){return `<div><label class="label">${label}</label><input id="set_${id}" type="${type}" class="w-full" value="${String(val).replaceAll('"','&quot;')}"></div>`}
function saveSettings(){['userName','monthlyGoal','annualGoal','priceCharged','commission'].forEach(k=>state.settings[k]=$('#set_'+k).type==='number'?+$('#set_'+k).value:$('#set_'+k).value);state.settings.templates={primeira:$('#tpl_primeira').value,follow:$('#tpl_follow').value,fechamento:$('#tpl_fechamento').value};save();toast('Configurações salvas.')}
function openModal(html){$('#modalRoot').innerHTML=`<div class="modal-backdrop" role="dialog" aria-modal="true"><div class="modal app-card w-full max-w-4xl p-5">${html}</div></div>`;setTimeout(()=>$('#modalRoot input, #modalRoot select, #modalRoot textarea, #modalRoot button')?.focus(),50)}
function closeModal(){$('#modalRoot').innerHTML=''}
function prospectForm(id=null,modal=true){const p=id?findP(id):makeProspect();const form=`<form id="prospectForm" class="space-y-4"><div class="flex items-center justify-between"><h2 class="text-2xl font-bold">${id?'Editar':'Novo'} prospect</h2><button type="button" class="btn btn-secondary" onclick="closeModal()">Fechar</button></div><div class="grid md:grid-cols-2 gap-3">${FIELDS.map(f=>`<div class="${['observacao','servicosOferecer','linkMaps'].includes(f[0])?'md:col-span-2':''}"><label class="label">${f[1]}</label>${f[0]==='status'?`<select name="status" class="w-full">${STATUS.map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('')}</select>`:(['observacao','servicosOferecer'].includes(f[0])?`<textarea name="${f[0]}" class="w-full">${p[f[0]]||''}</textarea>`:`<input name="${f[0]}" class="w-full" value="${(p[f[0]]||'').replaceAll('"','&quot;')}">`)}</div>`).join('')}<div><label class="label">Próximo follow-up</label><input name="nextFollowUp" type="date" class="w-full" value="${p.nextFollowUp?p.nextFollowUp.slice(0,10):''}"></div><div><label class="label">Tags (separadas por vírgula)</label><input name="tags" class="w-full" value="${(p.tags||[]).join(', ')}"></div></div><div class="flex flex-wrap gap-2"><button class="btn btn-primary" type="submit">Salvar</button><button class="btn btn-secondary" type="button" onclick="saveProspectForm('${id||''}',true)">Adicionar e cadastrar outro</button></div></form>`;if(modal)openModal(form);setTimeout(()=>{$('#prospectForm')&&($('#prospectForm').onsubmit=e=>{e.preventDefault();saveProspectForm(id||'',false)})},0);return form}
function openProspectModal(id=null){prospectForm(id,true)}
function saveProspectForm(id='',again=false){const form=$('#prospectForm'),data=Object.fromEntries(new FormData(form).entries());if(!data.nomeEmpresa)return toast('Nome da empresa é obrigatório.','error');data.tags=(data.tags||'').split(',').map(x=>x.trim()).filter(Boolean);data.nextFollowUp=data.nextFollowUp?new Date(data.nextFollowUp+'T12:00:00').toISOString():null;let p=id?findP(id):makeProspect();const old=p.status;Object.assign(p,data,{updatedAt:new Date().toISOString()});if(!id)state.prospects.push(p);if(old!==p.status)setStatus(p,p.status);if(data.nextFollowUp)record('follow_up_set',p.id,'Follow-up definido');save();toast('Prospect salvo.');if(again){form.reset();form.querySelector('[name=nomeEmpresa]').focus()}else{closeModal();render()}}
function openProspectDrawer(id){const p=findP(id);openModal(`<div class="flex justify-between items-start mb-4"><div><h2 class="text-2xl font-bold">${p.nomeEmpresa}</h2><p class="muted">${p.bairro||''} • ${p.status}</p></div><button class="btn btn-secondary" onclick="closeModal()">Fechar</button></div><div class="grid md:grid-cols-2 gap-4"><div class="inner-card p-4"><h3 class="font-bold mb-2">Detalhes</h3>${FIELDS.map(f=>`<p class="mb-2"><span class="muted text-sm">${f[1]}:</span><br><strong>${p[f[0]]||'—'}</strong></p>`).join('')}</div><div class="inner-card p-4"><h3 class="font-bold mb-2">Ações</h3><div class="flex flex-wrap gap-2 mb-4"><button class="btn btn-primary" onclick="openWhatsApp(findP('${p.id}'))">WhatsApp</button><button class="btn btn-secondary" onclick="openProspectModal('${p.id}')">Editar</button><button class="btn btn-secondary" onclick="window.open('${p.linkMaps||'#'}','_blank')">Abrir Maps</button></div><h3 class="font-bold mb-2">Histórico</h3>${state.actions.filter(a=>a.prospectId===p.id).map(a=>`<p class="text-sm border-b border-[var(--border)] py-2"><strong>${a.type}</strong> ${a.from?`${a.from} → ${a.to}`:''}<br><span class="muted">${fmt(a.createdAt)} ${a.note||''}</span></p>`).join('')||'<p class="muted">Sem histórico.</p>'}</div></div>`)}
function download(name,content,type='application/json'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function exportJSON(){download('backup_odg.json',JSON.stringify(state,null,2));toast('Backup JSON exportado.')}
function importJSON(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save();render();toast('Backup importado.')}catch(e){toast('JSON inválido.','error')}};r.readAsText(file)}
function sheet(rows,name){return XLSX.utils.json_to_sheet(rows)}
function exportAllXLSX(){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,sheet(state.prospects),'Prospects');XLSX.utils.book_append_sheet(wb,sheet(state.transactions),'Transações');XLSX.utils.book_append_sheet(wb,sheet(state.actions),'Ações');XLSX.writeFile(wb,'backup_odg.xlsx')}
function exportTransactions(){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,sheet(state.transactions),'Transações');XLSX.writeFile(wb,'relatorio_financeiro_odg.xlsx')}
function exportSelected(){const rows=state.prospects.filter(p=>selectedRows.has(p.id));if(!rows.length)return toast('Selecione linhas primeiro.','error');const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,sheet(rows),'Selecionados');XLSX.writeFile(wb,'prospects_selecionados.xlsx')}
function bulkStatus(){const s=prompt('Novo status: '+STATUS.join(', '));if(!STATUS.includes(s))return;state.prospects.filter(p=>selectedRows.has(p.id)).forEach(p=>setStatus(p,s));render();toast('Status em lote atualizado.')}
function bulkDelete(){if(!selectedRows.size||!confirm('Excluir selecionados?'))return;state.prospects=state.prospects.filter(p=>!selectedRows.has(p.id));save();render();toast('Selecionados excluídos.','error')}
function resetAll(){if(confirm('Tem certeza que deseja apagar tudo?')&&confirm('Confirma novamente: apagar todos os dados locais?')){state=defaultData();localStorage.setItem(STORAGE_KEY,JSON.stringify(state));render();toast('Sistema resetado.')}}

/* ========================= ATALHOS E BOOT ========================= */
